<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive">
<title>Leitura de concorrentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..850&display=swap">
<style>
:root { --bg: #f4f3f0; --panel: #fff; --ink: #18181a; --muted: #67665f; --line: #e3e1db; --hot: #d9501a; }
@media (prefers-color-scheme: dark) { :root { --bg: #121211; --panel: #1b1b1a; --ink: #edece7; --muted: #a3a199; --line: #2e2d2a; --hot: #ff7a3d; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
main { max-width: 880px; margin: 0 auto; padding: 48px 20px; }
h1 { font-weight: 800; font-stretch: 85%; font-size: 2.2rem; margin: 0 0 6px; letter-spacing: -.015em; }
p.sub { color: var(--muted); margin: 0 0 28px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--hot); }
a.card:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
a.card b { display: block; font-size: 1.5rem; font-weight: 800; font-stretch: 85%; margin-bottom: 8px; }
a.card span { color: var(--muted); font-size: 14px; }
</style></head><body><main>
<h1>Leitura de concorrentes</h1>
<p class="sub">Estratégia, anúncios ativos na Meta Ads Library, criativos para replicar e LPs. Levantamento de 14/10/2026.</p>
<div class="grid"><a class="card" href="nicho/web/"><b>Nicho</b><span>4.968 anúncios · 27 LPs</span></a><a class="card" href="zencial/web/"><b>Zencial</b><span>1.162 anúncios · 40 LPs</span></a><a class="card" href="renova-be/web/"><b>Renova Be</b><span>207 anúncios · 38 LPs</span></a></div>
</main></body></html>
